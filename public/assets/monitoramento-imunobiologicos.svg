  <text x="600" y="157" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="1.2" fill="url(#blue)">IMUNOBIOLÓGICOS</text>
  <path d="M330 181 H870" stroke="#ffff" stroke-width="4" stroke-linecap="round"/>
