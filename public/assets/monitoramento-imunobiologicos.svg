  <title id="title">Monitoramento Imunobiológicos</title>
  <desc id="desc">Título estilizado em azul com ícone de floco de neve e termômetro mais próximos das letras.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffff"/>
      <stop offset="100%" stop-color="#ffff"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#blue)" stroke-width="4" stroke-linecap="round">
    <path d="M40 63 H145"/>
    <path d="M1055 63 H1160"/>
  </g>
